server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # uma porta só (o-e02497): home.html vira redirect para o shell
    # emergência: /home.html?legado=1 ainda serve o arquivo antigo
    location = /home.html {
        if ($arg_legado != "1") {
            return 301 /app.html;
        }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # assets editados pelo fork (locale, config, tema): revalida sempre
    location ~ ^/(i18n/|config\.json$|conversa\.css$|seed-idioma\.js$|[a-z_-]+\.html$|manifest\.json$) {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # chunks do build upstream: imutáveis
    location /bundles/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # frontend direito: qualquer caminho serve o shell do app (rotas reais no histórico)
    location / {
        try_files /index.html =404;
    }
    error_page 404 =200 /index.html;
}
